<!doctype html>
<html lang="fr">
  <head><meta charset="utf-8" /><title>Formulaires Netlify</title></head>
  <body>
    <!-- Déclaration statique des formulaires pour la détection Netlify Forms. -->
    <form name="prevenir" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="prevenir" />
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="prenom" />
      <input type="text" name="nom" />
      <input type="email" name="email" />
      <select name="objet"></select>
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
